# Builds the Windows installer and portable exe, and the Linux AppImages and
# .debs, and publishes them as a GitHub release that installed copies of
# TableView update themselves from.
#
# To release, bump the version and push the tag it makes:
#
#   npm version 0.2.0          # or patch / minor / major
#   git push --follow-tags
#
# A tag with a pre-release part (v0.3.0-beta.1) is published as a pre-release,
# which the stable app never updates to.
#
# Run it by hand from the Actions tab to build the same files without releasing
# anything: they are kept on the run as artifacts instead.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

# Two pushes of the same tag must not race each other to the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The app reports, and compares updates against, the version in
      # package.json: a tag that says otherwise would publish a release no
      # installed copy could tell apart from the one it already has.
      - name: Tag matches package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Make the tag with 'npm version', which sets both."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Drafted once, before either build, so both upload to the same release —
  # and no installed copy sees it until every file is on it: a release without
  # its latest.yml or latest-linux.yml fails every update check.
  draft:
    name: Draft the release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Draft the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
              --title "TableView ${GITHUB_REF_NAME#v}"

  windows:
    name: Windows build
    needs: draft
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      # Read by electron-builder to upload to the draft.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the installer and the portable exe
        run: npm run build:win -- --publish ${{ github.event_name == 'push' && 'always' || 'never' }}
        env:
          # Optional. Without them the builds are unsigned, which works but has
          # Windows SmartScreen warn on first install. WIN_CSC_LINK is a
          # base64-encoded .pfx (or a URL to one), with its password beside it.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Keep the files
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: tableview-windows
          path: |
            release/*/TableView-*.exe
            release/*/TableView-*.exe.blockmap
            release/*/latest.yml
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux build
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # x64 and arm64 both, from this one machine: see electron-builder.yml.
      - name: Build the AppImages and the .debs
        run: npm run build:linux -- --publish ${{ github.event_name == 'push' && 'always' || 'never' }}

      - name: Keep the files
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: tableview-linux
          path: |
            release/*/TableView-*.AppImage
            release/*/TableView-*.deb
            release/*/latest-linux*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the release
    needs: [windows, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the release
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi
