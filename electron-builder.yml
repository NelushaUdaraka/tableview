appId: com.tableview.app
# productName is read from package.json, where Electron also takes the name of
# the app's data folder from; setting it here as well would let the two drift.
copyright: Copyright © 2026

directories:
  buildResources: build
  output: release/${version}

# The renderer, main and preload bundles are already built by electron-vite;
# node_modules is included because the database and SSH drivers are marked
# external (they are CommonJS and must not be bundled).
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!node_modules/**/{test,tests,__tests__,example,examples,doc,docs}/**'
  - '!node_modules/**/*.{md,markdown,ts,map}'
  - '!node_modules/.bin'

# Every production dependency is pure JavaScript, so nothing needs rebuilding
# for the target platform.
npmRebuild: false
buildDependenciesFromSource: false

asar: true

# Electron fuses, flipped in the packaged binary so the standard escape hatches
# are off: the app is never a general Node runtime (RunAsNode), NODE_OPTIONS and
# --inspect cannot inject code into it, and it only ever loads its own asar,
# whose contents are checked. grantFileProtocolExtraPrivileges is left on,
# because the renderer is still served from file://; turning it off needs a
# custom protocol first (see docs/limitations.md).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Every download is named for the system it runs on and the processor it is
  # for, so a release page lists TableView-<version>-windows-x64-… apart from
  # TableView-<version>-linux-…. The installer and the portable exe add which
  # of the two they are (see nsis and portable below).
  artifactName: ${productName}-${version}-windows-${arch}.${ext}
  # Unsigned builds are fine for local use; set CSC_LINK / CSC_KEY_PASSWORD
  # (or WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD, which the release workflow reads
  # from secrets) to sign, and electron-builder will pick them up automatically.
  signAndEditExecutable: true

# Releases are published to GitHub, and that is where the app looks for new
# ones: electron-builder writes this section into the installed app as
# resources/app-update.yml, and src/shared/updates.ts links to the same
# repository's release pages. Publishing only happens with `--publish`, which
# the release workflow passes; a local build:win never uploads anything.
publish:
  provider: github
  owner: NelushaUdaraka
  repo: tableview
  # A release electron-builder creates itself starts as a draft, which no
  # installed copy can see. The workflow drafts the release first anyway, and
  # publishes it once every file is up — so nobody is offered half a release.
  releaseType: draft

nsis:
  # "setup" in the name, so the release page says which download installs.
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TableView
  deleteAppDataOnUninstall: false
  runAfterFinish: true

portable:
  artifactName: ${productName}-${version}-windows-${arch}-portable.${ext}

linux:
  icon: build/icon.png
  category: Development
  # Both architectures are built on one x64 machine: nothing in the app is
  # native, so an arm64 build is the arm64 Electron around the same JavaScript.
  # The AppImage is listed first, so it is packed before the .deb writes its
  # package-type marker into the linux-unpacked folder they share; an AppImage
  # that carried the marker would still update as one (see main/updater.ts).
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  maintainer: TableView
  synopsis: SQL Server client
  description: A cross-platform SQL Server client built with Electron.
  # Electron takes the window's app_id (Wayland) and WM_CLASS (X11) from
  # desktopName in package.json; naming the .desktop file after it too is what
  # lets the taskbar match a running window to TableView's entry and icon.
  syncDesktopName: true
  # Named like the Windows files, the AppImages and the .debs alike, so the
  # .deb is not Debian's usual tableview_<version>_<arch>.deb. Each format
  # keeps its own word for the processor: x86_64 for an AppImage and amd64
  # for a .deb (the same 64-bit PCs), arm64 for both.
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

# The static AppImage runtime, which mounts with the FUSE 3 a desktop already
# has. electron-builder's default runtime needs libfuse2, which Ubuntu stopped
# installing with 22.04: an AppImage built with it will not even open on a
# fresh Ubuntu. electron-builder still calls this runtime a beta; it builds,
# runs and updates itself here, including restarting into a new version.
toolsets:
  appimage: '1.0.3'

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
